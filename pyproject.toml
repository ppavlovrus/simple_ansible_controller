[project]
name = "ansible-mcp"
version = "0.1.0"
description = "Minimal Ansible controller with an MCP interface for AI agents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Pavel Pavlov", email = "ppavlovrus@gmail.com" }]
dependencies = [
    "mcp>=1.2",
    # ansible-runner shells out to ansible-playbook, so the engine is a runtime
    # dependency, not a development one.
    "ansible-runner>=2.4",
    "ansible-core>=2.16",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
]


[tool.poetry]
packages = [{ include = "ansible_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.15"
mypy = "^1.11"
taskipy = "^1.13"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
tests = "pytest"
lint = "ruff check . && ruff format --check . && mypy src"
fmt = "ruff format . && ruff check --fix ."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is occasionally the honest annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
