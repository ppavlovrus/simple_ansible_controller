[project]
name = "ansible-mcp"
version = "0.1.0"
description = "Minimal Ansible controller with an MCP interface for AI agents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Pavel Pavlov", email = "ppavlovrus@gmail.com" }]
dependencies = [
    "mcp>=1.2",
    # ansible-runner shells out to ansible-playbook, so the engine is a runtime
    # dependency, not a development one.
    "ansible-runner>=2.4",
    "ansible-core>=2.16",
    "sqlalchemy[asyncio]>=2.0",
    # SQLAlchemy's own marker for greenlet excludes arm64, so its async mode
    # silently lacks a dependency on Apple Silicon. Ask for it explicitly.
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]


[project.scripts]
ansible-mcp = "ansible_mcp.__main__:main"

[tool.poetry]
packages = [{ include = "ansible_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.15"
mypy = "^1.11"
taskipy = "^1.13"
pre-commit = "^4.0"
types-pyyaml = "^6.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
serve = "python -m ansible_mcp"
tests = "pytest"
lint = "ruff check . && ruff format --check . && mypy src"
eval = "python evals/scenario_runner.py"
fmt = "ruff format . && ruff check --fix ."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "C90", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is occasionally the honest annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
# The harness is a script: it prints, it has a main(), and its judgements are
# data rather than an API.
"evals/*" = ["ANN", "T201"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
