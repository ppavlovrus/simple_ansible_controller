# Drop-in that lets the service launch containers, for installations that run
# playbooks in one (ADR-0016).
#
#   sudo mkdir -p /etc/systemd/system/ansible-mcp.service.d
#   sudo cp /usr/share/ansible-mcp/systemd/isolation.conf \
#           /etc/systemd/system/ansible-mcp.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ansible-mcp
#
# It is separate from the unit, and not part of it, because every line below
# weakens the unit's confinement. An installation that runs playbooks on the
# host keeps that confinement whole; one that moves them into a container
# trades three pieces of it for a stronger boundary around the playbook itself.
# That is a trade, and it belongs where it can be seen and reverted.
#
# The three were arrived at by removing each in turn on Ubuntu 24.04 with
# podman 4.9.3 and systemd 255, and watching the run fail. Delegate=yes,
# ProtectControlGroups=false, an XDG_RUNTIME_DIR of the service's own and a
# cgroup_manager setting were all tried first and turned out to be unnecessary:
# podman falls back on its own, noisily but correctly. Everything else the unit
# sets -- ProtectSystem=strict, ProtectHome, PrivateTmp, ProtectKernelModules,
# ProtectControlGroups, RestrictSUIDSGID, LockPersonality -- stays in force.

[Service]
# Rootless podman puts every container in a user namespace of its own, which
# RestrictNamespaces=true forbids outright.
RestrictNamespaces=

# The subordinate id ranges the package registers are mapped by newuidmap and
# newgidmap, setuid helpers that cannot gain the privilege they need while
# NoNewPrivileges is on.
NoNewPrivileges=false

# A container is given a /proc of its own, and mounting one is refused while
# the unit is protecting kernel tunables: "error mounting proc to rootfs at
# /proc: operation not permitted".
ProtectKernelTunables=false
