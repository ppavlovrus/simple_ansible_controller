# Test hosts for running playbooks against something real, plus an optional
# containerised controller to reach them from.
#
#   docker compose up -d                             # just the hosts, for the test suite
#   ANSIBLE_MCP_API_KEY=$(openssl rand -hex 32) \
#     docker compose --profile controller up -d      # and the controller
#
# The controller service exists because "how does a key reach the process" is
# the first thing a real deployment has to answer, and a compose file answers it
# more reliably than prose. See docs/connecting-hosts.md.
services:
  ansible_host_1:
    build:
      context: ./ansible_test_host
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 5s
      retries: 5

  ansible_host_2:
    build:
      context: ./ansible_test_host
      dockerfile: Dockerfile
    ports:
      - "2223:22"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Not started by default: the test suite only needs the hosts above, and this
  # service refuses to start without an API key (ADR-0012).
  controller:
    profiles: [controller]
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      # Passed through empty rather than demanded here. An unset key still fails
      # loudly -- the server exits 2 saying so, because this binds beyond
      # loopback (ADR-0012) -- and that refusal names what to do, where a compose
      # interpolation error only names a variable. Demanding it at this line made
      # `docker compose up -d` fail for the hosts-only profile too, since compose
      # interpolates the whole file whatever profile is active.
      ANSIBLE_MCP_API_KEY: ${ANSIBLE_MCP_API_KEY:-}
    volumes:
      # Read-only, and at the path ssh looks in by default for this user, so an
      # inventory need not name the key at all. Mode 600 on the host is required:
      # ssh ignores a key that is group- or world-readable.
      - ./tests/fixtures/keys/id_rsa:/var/lib/ansible-mcp/.ssh/id_ed25519:ro
    depends_on:
      ansible_host_1:
        condition: service_healthy
      ansible_host_2:
        condition: service_healthy
