# Test hosts for running playbooks against something real.
# The application itself runs on the host during development; its image is built
# separately once there is a server to run.
services:
  ansible_host_1:
    build:
      context: ./ansible_test_host
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 5

  ansible_host_2:
    build:
      context: ./ansible_test_host
      dockerfile: Dockerfile
    ports:
      - "2223:22"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 5
